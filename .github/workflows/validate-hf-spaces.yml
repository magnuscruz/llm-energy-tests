name: Validate Hugging Face Space Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt

      - name: Validate Python files
        run: |
          python -m py_compile app.py
          python -m py_compile src/build_dashboard.py

      - name: Validate imports
        run: |
          python - <<'PY'
          import streamlit
          import pandas
          import plotly
          import os
          import sys
          from pathlib import Path
          ROOT = Path('')
          sys.path.insert(0, str(ROOT / 'src'))
          import build_dashboard
          PY

      - name: Print summary
        run: |
          echo "✅ HF Spaces validation completed successfully"
